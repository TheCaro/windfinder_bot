name: Windbot Wannsee

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vorhersage prüfen und melden
        run: node bot.js
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Gemeldete Tage speichern
        run: |
          git config user.name "windbot"
          git config user.email "windbot@users.noreply.github.com"
          git add gemeldet.json
          git diff --cached --quiet || (git commit -m "Gemeldete Tage aktualisiert" && git push)
